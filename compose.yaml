services:
  docs:
    build: .
    image: kod-docs:1.0.0
    # Build once for the runtime. Content is supplied by this read-only host directory.
    volumes:
      - type: bind
        source: ${DOCS_CONTENT_DIR:-./modern-docs/dist}
        target: /app/modern-docs/dist
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    ports:
      - "${DOCS_BIND:-127.0.0.1}:${DOCS_PORT:-8088}:8080"
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      DOCS_AUTH_USER: ${DOCS_AUTH_USER:-}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:-}
      DOCS_TRUSTED_PROXIES: ${DOCS_TRUSTED_PROXIES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1.0
