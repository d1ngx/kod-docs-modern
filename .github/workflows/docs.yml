name: Build and test docs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package:static
      - run: node modern-docs/check.mjs --static
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: kod-docs-static
          path: modern-docs/releases/kod-docs-static.zip
      - run: pnpm package:content
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: kod-docs-content
          path: modern-docs/releases/kod-docs-content.zip
